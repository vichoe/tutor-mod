[General]
Enabled=true

; No matching card in the deck: true = the effect does nothing,
; false = conjure a card normally instead
Fizzle=true

; draw = move the card to the top of the deck and draw it (counts as drawn)
; conjure = create the card, then remove one copy from the deck (counts as conjure)
Delivery=draw

; Log every tutor decision, including the AI's simulated plays
Verbose=false
